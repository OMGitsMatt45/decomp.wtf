[package]
name = "ctr_runtime"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
publish = false
build = "build.rs"

[[bin]]
name = "ctr_runtime"
path = "src/main.rs"

[[bin]]
name = "ctr_gpu_scenes"
path = "src/gpu_scenes.rs"

[workspace]

[features]
default = []
desktop = ["dep:winit"]

[dependencies]
zakuro-core = { path = "../runtime/crates/zakuro-core" }
zakuro-cpu = { path = "../runtime/crates/zakuro-cpu" }
zakuro-common = { path = "../runtime/crates/zakuro-common" }
zakuro-gpu = { path = "../runtime/crates/zakuro-gpu", default-features = false, features = ["vulkan"] }
winit = { version = "0.30", optional = true, default-features = false, features = ["rwh_06", "x11"] }
sha2 = "0.10"
serde_json = "1"

[profile.dev]
opt-level = 1
debug = 0
incremental = false

[profile.release]
opt-level = 2
debug = 0
lto = false
codegen-units = 16
