[agbcc]
name = "agbcc"
platform = "GBA"
arch = "arm"
license = "GPL-2.0"
source = "pret/agbcc release + restored GCC 2.95.3 C++ frontend"
description = "The GBA compiler rebuilt by pret, with distinct restored GCC 2.95.3 C++ frontends for its normal and old Thumb backends."
cc = ["{tc}/bin/agbcc"]
flags = ["-mthumb-interwork", "-O2"]
requires = ["arm-gnu"]
windows_cmd = ["{python}", "-m", "decompnet.agbcc", "--cpp", "{tc:arm-gnu}/bin/arm-none-eabi-cpp.exe", "--cc", "{tc}/bin/agbcc.exe", "--as", "{tc:arm-gnu}/bin/arm-none-eabi-as.exe", "--builtin-include", "{tc}/include", "--src", "{src}", "--obj", "{obj}", "--include", "{include}", "--", "{flags}"]
# agbcc only compiles preprocessed C to assembly: preprocess, compile, assemble, like pret's builds
cmd = ["/bin/sh", "-c", "src=\"$1\"; obj=\"$2\"; inc=\"$3\"; shift 3; \"{tc:arm-gnu}/bin/arm-none-eabi-cpp\" -nostdinc -undef -I \"{tc}/include\" -I \"$inc\" \"$src\" -o \"$obj.i\" && \"{tc}/bin/agbcc\" \"$@\" \"$obj.i\" -o \"$obj.s\" && \"{tc:arm-gnu}/bin/arm-none-eabi-as\" -mcpu=arm7tdmi -o \"$obj\" \"$obj.s\"", "agbcc", "{src}", "{obj}", "{include}", "{flags}"]
[[agbcc.parts]]
url = "https://github.com/pret/agbcc/releases/download/release/agbcc.tar.gz"
sha256 = "bcf0197e3e27d8e08506a142e25fa68ea7f6679a98347a6406804eb3f9ff4d29"
platforms = ["linux-x86_64"]

