name = "Shared Demo Quest functions"
slug = "shared-game"
description = "Original CC0 functions for supported-console tests; this matching fixture uses PS1 GCC."

[legal]
basis = "own-code"
license = "CC0-1.0"
notes = "Demo Quest was written for DecompNet; its full source is in original/."

[compiler]
toolchain = "gcc-2.7.2-psx"   # pinned PS1 compiler; source is also used by DS, PS2 and GBA fixtures
timeout = 15

[target]
objects = ["target/game.o"]
build_from = "original/game.c"   # own code: build the target with the same sandboxed toolchain

[context]
file = "include/context.h"
