name: Full operational check

on:
  workflow_dispatch:
  push:
    branches: [main, codex/release-operational-check]
    paths:
      - '.github/workflows/**'
      - 'src/**'
      - 'tests/**'
      - 'tools/**'
      - 'native/**'
      - 'projects/**'
      - 'site/public/**'
      - '*.cmd'
      - 'pyproject.toml'
      - 'uv.lock'

permissions:
  contents: read

jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      DECOMP_RUNTIME: native
      DECOMP_UPDATES: 'off'
      DECOMP_TEST_N64_CPP: '1'
      DECOMP_TEST_IDO_CPP: '1'
      DECOMP_TEST_IDO_CFRONT: '1'
      DECOMP_TEST_GBA_CPP: '1'
      DECOMP_TEST_PSX_CPP: '1'
      DECOMP_TEST_PS2_CPP: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --group dev --python 3.12
      - name: Linux runtime and linkers
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libc6-i386 llvm lld bubblewrap
      - name: Isolate downloaded toolchains
        shell: bash
        run: echo "DECOMPNET_TOOLCHAINS=$RUNNER_TEMP/Operational toolchains with spaces" >> "$GITHUB_ENV"
      - name: Install all platform toolchains
        shell: bash
        run: |
          for tool in gcc-2.7.2-kmc gcc-2.7.2-psx gcc-2.8.1-psx ee-gcc-2.96 ido-5.3 ido-7.1 arm-gnu agbcc m2c luvdis binutils-mips gc-wii-binutils objdiff-cli dtk sjiswrap dtk-template mwcc mwccarm dsd; do
            uv run --no-sync decompnet toolchain install "$tool" --accept-license || exit 1
          done
      - name: Build original homebrew fixtures
        shell: bash
        run: |
          uv run --no-sync python projects/zlib-n64/prepare.py
          uv run --no-sync python projects/demo-ds/build.py
          uv run --no-sync python projects/demo-gc/build.py
      - name: Full application and compiler suite (GB/GBC reported separately)
        run: uv run --no-sync python -m pytest -q --ignore=tests/test_gb.py --ignore=tests/test_gb_app.py --junitxml=operational-results.xml
      - name: Report failures
        if: failure()
        shell: bash
        run: |
          uv run --no-sync python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as E
          result = Path('operational-results.xml')
          if result.exists():
              for tag in ('failure', 'error'):
                  for node in E.parse(result).iter(tag):
                      text = (node.text or node.get('message', ''))[-5000:]
                      print('::error::' + text.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A'))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: operational-${{ matrix.os }}
          path: operational-results.xml

  gameboy:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      DECOMP_TEST_GB_ASM: '1'
      DECOMP_UPDATES: 'off'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --group dev --python 3.12
      - run: uv run --no-sync decompnet toolchain install rgbds
      - run: uv run --no-sync python -m pytest -q tests/test_gb.py tests/test_gb_app.py --junitxml=gameboy-results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: operational-gameboy-${{ matrix.os }}
          path: gameboy-results.xml
