name: Full operational check

on:
  workflow_dispatch:
  push:
    branches: [main, codex/release-operational-check, codex/rom-input-operational-fixes]
    paths:
      - '.github/workflows/**'
      - 'src/**'
      - 'tests/**'
      - 'tools/**'
      - 'native/**'
      - 'projects/**'
      - 'site/public/**'
      - '*.cmd'
      - 'pyproject.toml'
      - 'uv.lock'

permissions:
  contents: read

jobs:
  package:
    uses: ./.github/workflows/package.yml
    with:
      tag: v0.19.0

  core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      DECOMP_RUNTIME: native
      DECOMP_UPDATES: 'off'
      DECOMP_TEST_NATIVE_WINDOWS: '1'
      DECOMP_TEST_N64_CPP: '1'
      DECOMP_TEST_IDO_CPP: '1'
      DECOMP_TEST_IDO_CFRONT: '1'
      DECOMP_TEST_GBA_CPP: '1'
      DECOMP_TEST_PSX_CPP: '1'
      DECOMP_TEST_PS2_CPP: '1'
      DECOMP_TEST_OPTIONAL_TOOLS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --group dev --python 3.12
      - name: Native analyzer worker-thread regression
        run: uv run --no-sync python tools/run_operational.py tests/test_native_threads.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Linux runtime and linkers
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libc6-i386 llvm lld bubblewrap qemu-user-static
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Isolate downloaded toolchains
        shell: bash
        run: echo "DECOMPNET_TOOLCHAINS=$RUNNER_TEMP/Operational toolchains with spaces" >> "$GITHUB_ENV"
      - name: Install Windows LLVM tools
        if: runner.os == 'Windows'
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: '19.1.7'
          force-url: https://github.com/llvm/llvm-project/releases/download/llvmorg-19.1.7/clang+llvm-19.1.7-x86_64-pc-windows-msvc.tar.xz
          directory: ${{ runner.temp }}/complete-llvm
      - name: Verify fixture linkers are available
        run: uv run --no-sync python -c "import shutil; assert shutil.which('ld.lld'), 'ld.lld is required'; assert shutil.which('llvm-objcopy'), 'llvm-objcopy is required'"
      - name: Install all platform toolchains
        run: uv run --no-sync python -m tools.operational
      - name: Full application and compiler suite (GB/GBC reported separately)
        run: uv run --no-sync python tools/run_operational.py
      - name: Require real platform coverage
        run: uv run --no-sync python tools/check_operational_results.py operational-results.xml
      - name: Verify period compiler emulation inside Docker
        if: runner.os == 'Linux'
        env:
          DECOMP_TEST_LINUX_I386: '1'
          DECOMP_QEMU_I386: /usr/bin/qemu-i386-static
          DECOMP_COMPILER_IMAGE: debian:trixie-slim@sha256:62bd423aeee912639ca8ee681c2b762cb3e25137e0a92b20be455898a9f034ad
        run: uv run --no-sync python -m pytest -q tests/test_linux_i386_real.py --junitxml=i386-results.xml
      - name: Report failures
        if: always()
        run: uv run --no-sync python tools/operational_report.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: operational-${{ matrix.os }}
          path: |
            operational-results.xml
            operational-output.log
            i386-results.xml

  gameboy:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      DECOMP_TEST_GB_ASM: '1'
      DECOMP_UPDATES: 'off'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --group dev --python 3.12
      - run: uv run --no-sync decompnet toolchain install rgbds
      - run: uv run --no-sync python -m pytest -q tests/test_gb.py tests/test_gb_app.py --junitxml=gameboy-results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: operational-gameboy-${{ matrix.os }}
          path: gameboy-results.xml
