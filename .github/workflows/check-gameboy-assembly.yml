name: Game Boy native assembly

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/check-gameboy-assembly.yml'
      - 'src/decompnet/rom/gb*.py'
      - 'src/decompnet/rom/sm83.py'
      - 'src/decompnet/rom/export_gb*.py'
      - 'src/decompnet/rom/match_gb.py'
      - 'src/decompnet/app/**'
      - 'src/decompnet/compiler.py'
      - 'src/decompnet/project.py'
      - 'src/decompnet/cpp.py'
      - 'src/decompnet/network.py'
      - 'src/decompnet/scoring.py'
      - 'src/decompnet/toolchains.py'
      - 'src/decompnet/toolchains.toml'
      - 'src/decompnet/cli.py'
      - 'tests/test_gb.py'
      - 'tests/test_gb_app.py'
  pull_request:
    paths:
      - '.github/workflows/check-gameboy-assembly.yml'
      - 'src/decompnet/rom/gb*.py'
      - 'src/decompnet/rom/sm83.py'
      - 'src/decompnet/rom/export_gb*.py'
      - 'src/decompnet/rom/match_gb.py'
      - 'src/decompnet/app/**'
      - 'src/decompnet/compiler.py'
      - 'src/decompnet/project.py'
      - 'src/decompnet/cpp.py'
      - 'src/decompnet/network.py'
      - 'src/decompnet/scoring.py'
      - 'src/decompnet/toolchains.py'
      - 'src/decompnet/toolchains.toml'
      - 'src/decompnet/cli.py'
      - 'tests/test_gb.py'
      - 'tests/test_gb_app.py'

permissions:
  contents: read

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      DECOMP_TEST_GB_ASM: '1'
      DECOMP_UPDATES: 'off'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --group dev --python 3.12
      - name: Use a toolchain directory containing spaces
        shell: bash
        run: echo "DECOMPNET_TOOLCHAINS=$RUNNER_TEMP/Game Boy native tools" >> "$GITHUB_ENV"
      - run: uv run --no-sync decompnet toolchain install rgbds
      - name: Required native assembly checks
        run: uv run --no-sync python -m pytest -q tests/test_gb.py tests/test_gb_app.py tests/test_toolchains.py tests/test_cpp_output.py tests/test_agents.py --junitxml=gameboy-results.xml
      - name: Report failures
        if: failure()
        shell: bash
        run: |
          uv run --no-sync python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          result = Path('gameboy-results.xml')
          if result.exists():
              for node in ET.parse(result).iter('failure'):
                  text = (node.text or node.get('message', ''))[-6000:]
                  print('::error::' + text.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A'))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gameboy-${{ matrix.os }}
          path: gameboy-results.xml
