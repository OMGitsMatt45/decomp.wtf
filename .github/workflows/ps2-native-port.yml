name: PS2 standalone native project

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/decompnet/ps2_native/**'
      - 'src/decompnet/pc.py'
      - 'src/decompnet/pc_cli.py'
      - 'src/decompnet/app/**'
      - 'tools/qualify_ps2_port.py'
      - 'tests/test_ps2_native_*.py'
      - 'tests/test_ps2_iop_*.py'
      - 'tests/test_ps2_vu_discovery.py'
      - 'tests/test_ps2_hardware.py'
      - 'tools/ps2_hardware.py'
      - 'tools/qualify_ps2_hardware.py'
      - 'tools/qualify-ps2-hardware.ps1'
      - 'tests/fixtures/ps2_port.py'
      - 'tests/fixtures/ps2_iop.py'
      - 'tests/fixtures/ps2_vu_native.*'
      - '.github/workflows/ps2-native-port.yml'
      - 'pyproject.toml'
      - 'uv.lock'

permissions:
  contents: read

jobs:
  standalone:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 55
    env:
      DECOMP_RUNTIME: native
      DECOMP_UPDATES: 'off'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --group dev --python 3.12
      - name: Original disc, code map and application route checks
        run: >-
          uv run --no-sync python -m pytest -q
          tests/test_ps2_native_media.py tests/test_ps2_native_profile.py
          tests/test_ps2_native_codegen.py tests/test_ps2_native_registry.py
          tests/test_ps2_native_disc_files.py tests/test_ps2_native_provider.py
          tests/test_ps2_native_app.py
          tests/test_ps2_native_discovery.py tests/test_ps2_native_indirect.py tests/test_ps2_native_recovery.py
          tests/test_ps2_vu_discovery.py
          tests/test_ps2_hardware.py
      - name: Validate the local Windows GPU command syntax
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD 'tools/qualify-ps2-hardware.ps1'), [ref]$tokens, [ref]$errors)
          if ($errors.Count -gt 0) { throw ($errors | Out-String) }
          $originalPath = $env:PATH
          $originalTemp = $env:TEMP
          try {
            # A regular PowerShell shell need not expose Visual Studio's CMake.
            $env:PATH = (($env:PATH -split ';') | Where-Object { $_ -and -not (Test-Path (Join-Path $_ 'cmake.exe')) }) -join ';'
            $env:TEMP = 'C:\Users\Windows Validation User\AppData\Local\Temp'
            $found = & .\tools\qualify-ps2-hardware.ps1 -CheckTools | ConvertFrom-Json
            if (-not (Test-Path -LiteralPath $found.uv)) { throw 'uv discovery failed' }
            if ($found.cmake -notlike '*Microsoft Visual Studio*' -or -not (Test-Path -LiteralPath $found.cmake)) { throw 'Visual Studio bundled CMake discovery failed' }
            $env:DECOMP_PS2_CHECK_OUTPUT = $found.output
          } finally { $env:PATH = $originalPath; $env:TEMP = $originalTemp }
          uv run --no-sync python -c "import os; from pathlib import Path; from tools.qualify_ps2_hardware import fixture_path; from decompnet.ps2_native import emitter_directory, EMITTER_LONG_SOURCE; sdk=fixture_path(Path(os.environ['DECOMP_PS2_CHECK_OUTPUT']))/'Pinned source runtime'; source=emitter_directory(sdk,'0'*64)/EMITTER_LONG_SOURCE; assert len(str(source))<240, str(source)"
          if ($LASTEXITCODE -ne 0) { throw 'default hardware build exceeds the Windows path budget' }
      - name: Windows standalone build, required GPU failure and vector checks
        if: runner.os == 'Windows'
        run: >-
          uv run --no-sync python -m tools.qualify_ps2_port
          "${{ runner.temp }}/PS2 standalone results" --build-only
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ps2-standalone-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/PS2 standalone results/assessment.json
            ${{ runner.temp }}/PS2 standalone results/*.json
            ${{ runner.temp }}/PS2 standalone results/*.log
            ${{ runner.temp }}/PS2 standalone results/*.ppm
