name: PC-output foundation

on:
  workflow_dispatch:
  pull_request:
    paths: ['src/**', 'tests/**', 'pyproject.toml', 'uv.lock', '.github/workflows/pc-foundation.yml']
  push:
    branches: [codex/pc-output-foundation]

permissions:
  contents: read

jobs:
  foundation:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      DECOMP_RUNTIME: native
      DECOMP_UPDATES: 'off'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --group dev --python 3.12
      - name: Check remaining platform gates and build/execute the host output fixture
        run: >-
          uv run --no-sync python -m pytest -q
          tests/test_platform_scope.py tests/test_pc_output.py tests/test_native_threads.py tests/test_input_layouts.py
          tests/test_ci_policy.py tests/test_release_gate.py
          tests/test_windows_installer.py tests/test_install_source.py
          tests/test_pc_projects.py tests/test_agents.py tests/test_app_server.py tests/test_updates.py
          tests/test_nds_native_app.py tests/test_psx_native_app.py tests/test_ps2_native_app.py
          tests/test_gba_native_app.py tests/test_ctr_native_app.py
          tests/test_psx_boundaries.py tests/test_psx_data_review.py tests/test_psx_recover.py
          --junitxml=pc-foundation-results.xml
      - name: Check browser JavaScript syntax
        run: node --check src/decompnet/app/static/app.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pc-foundation-${{ matrix.os }}
          path: pc-foundation-results.xml
