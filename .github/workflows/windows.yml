name: Windows compatibility

on:
  push:
    paths:
      - ".github/workflows/windows.yml"
      - "pyproject.toml"
      - "uv.lock"
      - "*.cmd"
      - ".gitattributes"
      - "site/public/*.ps1"
      - "site/public/*.sh"
      - "src/**"
      - "tests/**"
  pull_request:
    paths:
      - ".github/workflows/windows.yml"
      - "pyproject.toml"
      - "uv.lock"
      - "*.cmd"
      - ".gitattributes"
      - "site/public/*.ps1"
      - "site/public/*.sh"
      - "src/**"
      - "tests/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 15
    defaults:
      run:
        # The installer also supports the Windows PowerShell shipped with Windows.
        shell: powershell
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked --group dev --python 3.12
      - name: Check Windows platform and installer behavior
        # These tests use fake CLIs and isolated config/registry locations. They do
        # not install a distribution or change the runner's agent configuration.
        run: >-
          uv run --no-sync python -m pytest -q
          tests/test_platform.py tests/test_windows_installer.py
      - name: Check offline update metadata
        run: >-
          uv run --no-sync python -m pytest -q tests/test_updates.py
          -k "not install_runs_uv_then_the_new_setup and not restart_keeps_port_and_secret and not update_api"

  linux-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked --group dev --python 3.12
      - name: Check paths and bridges used inside WSL
        run: >-
          uv run --no-sync python -m pytest -q
          tests/test_hostenv.py tests/test_updates.py tests/test_windows_installer.py tests/test_install_source.py
      - name: Check invalid WSL paths produce an actionable import error
        run: >-
          uv run --no-sync python -m pytest -q
          tests/test_app_server.py -k another_wsl_distribution

# Real WSL 2 installation needs virtualization, elevated feature changes and
# sometimes a Windows restart. Keep that an explicit Windows-machine smoke check
# rather than a hosted job that silently skips it (tests/test_wsl_windows.py).
