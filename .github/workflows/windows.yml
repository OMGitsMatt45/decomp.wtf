name: Windows compatibility

on:
  push:
    paths:
      - ".github/workflows/windows.yml"
      - "pyproject.toml"
      - "uv.lock"
      - "*.cmd"
      - ".gitattributes"
      - "site/public/*.ps1"
      - "site/public/*.sh"
      - "src/**"
      - "tests/**"
      - "native/**"
      - "tools/build_n64_native.py"
      - "tools/windows/**"
      - "tools/gba_cpp/**"
      - "tools/psx_cpp/**"
      - "projects/demo-gba/**"
      - "projects/demo-psx/**"
      - "projects/demo-n64/original/**"
      - "projects/demo-rom/src/**"
      - "projects/zlib-n64/prepare.py"
  pull_request:
    paths:
      - ".github/workflows/windows.yml"
      - "pyproject.toml"
      - "uv.lock"
      - "*.cmd"
      - ".gitattributes"
      - "site/public/*.ps1"
      - "site/public/*.sh"
      - "src/**"
      - "tests/**"
      - "native/**"
      - "tools/build_n64_native.py"
      - "tools/windows/**"
      - "tools/gba_cpp/**"
      - "tools/psx_cpp/**"
      - "projects/demo-gba/**"
      - "projects/demo-psx/**"
      - "projects/demo-n64/original/**"
      - "projects/demo-rom/src/**"
      - "projects/zlib-n64/prepare.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 25
    env:
      DECOMP_RUNTIME: native
      DECOMP_TEST_NATIVE_WINDOWS: "1"
    defaults:
      run:
        # The installer also supports the Windows PowerShell shipped with Windows.
        shell: powershell
    steps:
      - uses: actions/checkout@v4
      - name: Use an isolated native toolchain directory with spaces
        run: |
          $tools = Join-Path $env:RUNNER_TEMP "decomp native toolchains"
          "DECOMPNET_TOOLCHAINS=$tools" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked --group dev --python 3.12
      - name: Check the bundled N64 C++ analyzer
        timeout-minutes: 2
        run: >-
          uv run --no-sync python -m pytest -q -o faulthandler_timeout=60
          tests/test_n64_native.py tests/test_n64code.py tests/test_overlays.py
      - name: Build the N64 C++ analyzer
        run: uv run --no-sync python tools/build_n64_native.py
      - name: Check Windows platform and installer behavior
        timeout-minutes: 3
        # These tests use fake CLIs and isolated config/registry locations. They do
        # not install a distribution or change the runner's agent configuration.
        run: >-
          uv run --no-sync python -m pytest -q -o faulthandler_timeout=60
          tests/test_platform.py tests/test_windows_installer.py tests/test_native_runtime.py
          tests/test_n64_native.py tests/test_n64code.py tests/test_overlays.py tests/test_toolchains.py tests/test_cpp_output.py
      - name: Check offline update metadata
        run: >-
          uv run --no-sync python -m pytest -q tests/test_updates.py
          -k "not install_runs_uv_then_the_new_setup and not restart_keeps_port_and_secret and not update_api"
      - name: Install the Windows app from this checkout
        run: |
          $env:UV_TOOL_DIR = Join-Path $env:RUNNER_TEMP "decomp installed environments"
          $env:UV_TOOL_BIN_DIR = Join-Path $env:RUNNER_TEMP "decomp installed commands"
          & .\site\public\install.ps1 -NoStart -NoConnect
          if ($LASTEXITCODE -ne 0) { throw "Installing the native Windows app failed" }
          & (Join-Path $env:UV_TOOL_BIN_DIR "decomp.exe") --help
          if ($LASTEXITCODE -ne 0) { throw "The installed native Windows command did not start" }
          $python = Join-Path $env:UV_TOOL_DIR "decompnet\Scripts\python.exe"
          & $python -I -c "from decompnet.app import cli; from decompnet import toolchains; from decompnet.rom import n64; assert toolchains.current_platform() == 'windows-x86_64'; assert n64.to_z64(bytes.fromhex('80371240'))[1] == 'z64'; print('Installed native app and N64 C++ analyzer load successfully')"
          if ($LASTEXITCODE -ne 0) { throw "The installed Windows app environment is incomplete" }
      - name: Install the pinned free Windows compilers and tools
        run: |
          foreach ($tool in @("gcc-2.7.2-kmc", "gcc-2.7.2-psx", "gcc-2.8.1-psx", "arm-gnu", "agbcc", "objdiff-cli", "dtk", "binutils-mips", "gc-wii-binutils")) {
            uv run --no-sync decompnet toolchain install $tool
            if ($LASTEXITCODE -ne 0) { throw "Installing native $tool failed" }
          }
      - name: Import, match and rebuild the demo using native Windows tools
        env:
          DECOMP_TEST_N64_CPP: "1"
        run: |
          uv run --no-sync python -m pytest -q tests/test_windows_native.py tests/test_n64_cpp.py --junitxml=native-windows-results.xml
          if ($LASTEXITCODE -ne 0) { throw "Native Windows integration failed" }
          [xml]$results = Get-Content -Raw native-windows-results.xml
          if ([int]$results.testsuites.testsuite.skipped -ne 0) { throw "Required native Windows integration tests were skipped" }
      - name: Verify native IDO C++ compilation and exported rebuilds
        env:
          DECOMP_TEST_IDO_CPP: "1"
        run: |
          foreach ($tool in @("ido-7.1", "ido-5.3", "m2c")) {
            uv run --no-sync decompnet toolchain install $tool --accept-license
            if ($LASTEXITCODE -ne 0) { throw "Installing native $tool failed" }
          }
          uv run --no-sync python -m pytest -q tests/test_ido_cpp.py --junitxml=ido-cpp-results.xml
          if ($LASTEXITCODE -ne 0) { throw "Native IDO C++ integration failed" }
          [xml]$results = Get-Content -Raw ido-cpp-results.xml
          if ([int]$results.testsuites.testsuite.skipped -ne 0) { throw "Required IDO C++ tests were skipped" }
      - name: Verify native GBA C++ drafts, matching and clean exported rebuilds
        env:
          DECOMP_TEST_GBA_CPP: "1"
        run: |
          uv run --no-sync decompnet toolchain install luvdis
          if ($LASTEXITCODE -ne 0) { throw "Installing luvdis failed" }
          uv run --no-sync python projects/zlib-n64/prepare.py
          if ($LASTEXITCODE -ne 0) { throw "Preparing the homemade GBA fixture failed" }
          uv run --no-sync python -m pytest -q tests/test_gba.py tests/test_gba_cpp.py --junitxml=gba-cpp-results.xml
          if ($LASTEXITCODE -ne 0) { throw "Native GBA C++ integration failed" }
          [xml]$results = Get-Content -Raw gba-cpp-results.xml
          if ([int]$results.testsuites.testsuite.skipped -ne 0) { throw "Required GBA C++ tests were skipped" }
      - name: Verify native PS1 C++ drafts, strict matching and clean exported rebuilds
        env:
          DECOMP_TEST_PSX_CPP: "1"
        run: |
          uv run --no-sync python -m pytest -q tests/test_psx.py tests/test_psx_cpp.py --junitxml=psx-cpp-results.xml
          if ($LASTEXITCODE -ne 0) { throw "Native PS1 C++ integration failed" }
          [xml]$results = Get-Content -Raw psx-cpp-results.xml
          if ([int]$results.testsuites.testsuite.skipped -ne 0) { throw "Required PS1 C++ tests were skipped" }
      - name: Save native Windows integration results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-windows-results
          path: native-windows-results.xml
          if-no-files-found: ignore

  linux-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked --group dev --python 3.12
      - name: Check the bundled N64 C++ analyzer
        run: >-
          uv run --no-sync python -m pytest -q
          tests/test_n64_native.py tests/test_n64code.py tests/test_overlays.py
      - name: Build the N64 C++ analyzer
        run: uv run --no-sync python tools/build_n64_native.py
      - name: Check Linux runtime and optional WSL compatibility
        run: >-
          uv run --no-sync python -m pytest -q
          tests/test_hostenv.py tests/test_updates.py tests/test_windows_installer.py tests/test_install_source.py tests/test_native_runtime.py
          tests/test_n64_native.py tests/test_n64code.py tests/test_overlays.py tests/test_toolchains.py tests/test_cpp_output.py
      - name: Verify real N64 C++ compilation and exported project rebuilds
        env:
          DECOMP_TEST_N64_CPP: "1"
        run: |
          if ! command -v ld.lld >/dev/null || ! command -v llvm-objcopy >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y lld llvm
          fi
          uv run --no-sync decompnet toolchain install gcc-2.7.2-kmc
          uv run --no-sync decompnet toolchain install binutils-mips
          uv run --no-sync python projects/zlib-n64/prepare.py
          uv run --no-sync python -m pytest -q tests/test_n64_cpp.py tests/test_export.py -k "not psx and not ps2" --junitxml=n64-cpp-results.xml
          uv run --no-sync python -c "import xml.etree.ElementTree as E; root=E.parse('n64-cpp-results.xml').getroot(); assert sum(int(s.get('skipped', 0)) for s in root.iter('testsuite')) == 0, 'Required N64 C++ checks were skipped'"
      - name: Check invalid WSL paths produce an actionable import error
        run: >-
          uv run --no-sync python -m pytest -q
          tests/test_app_server.py -k another_wsl_distribution
      - name: Verify IDO C++ compilation and exported rebuilds
        env:
          DECOMP_TEST_IDO_CPP: "1"
        run: |
          uv run --no-sync decompnet toolchain install ido-7.1 --accept-license
          uv run --no-sync decompnet toolchain install ido-5.3 --accept-license
          uv run --no-sync decompnet toolchain install m2c
          uv run --no-sync python -m pytest -q tests/test_ido_cpp.py --junitxml=ido-cpp-results.xml
          uv run --no-sync python -c "import xml.etree.ElementTree as E; root=E.parse('ido-cpp-results.xml').getroot(); assert sum(int(s.get('skipped', 0)) for s in root.iter('testsuite')) == 0, 'Required IDO C++ checks were skipped'"
      - name: Verify GBA C++ drafts, matching and clean exported rebuilds
        env:
          DECOMP_TEST_GBA_CPP: "1"
        run: |
          uv run --no-sync decompnet toolchain install agbcc
          uv run --no-sync decompnet toolchain install luvdis
          uv run --no-sync python -m pytest -q tests/test_gba.py tests/test_gba_cpp.py --junitxml=gba-cpp-results.xml
          uv run --no-sync python -c "import xml.etree.ElementTree as E; root=E.parse('gba-cpp-results.xml').getroot(); assert sum(int(s.get('skipped', 0)) for s in root.iter('testsuite')) == 0, 'Required GBA C++ checks were skipped'"
      - name: Verify PS1 C++ drafts, strict matching and clean exported rebuilds
        env:
          DECOMP_TEST_PSX_CPP: "1"
        run: |
          uv run --no-sync decompnet toolchain install gcc-2.7.2-psx
          uv run --no-sync decompnet toolchain install gcc-2.8.1-psx
          uv run --no-sync python -m pytest -q tests/test_psx.py tests/test_psx_cpp.py --junitxml=psx-cpp-results.xml
          uv run --no-sync python -c "import xml.etree.ElementTree as E; root=E.parse('psx-cpp-results.xml').getroot(); assert sum(int(s.get('skipped', 0)) for s in root.iter('testsuite')) == 0, 'Required PS1 C++ checks were skipped'"
  gba-sandbox:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --group dev --python 3.12
      - name: Verify the Linux GBA C++ compile sandbox
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          uv run --no-sync decompnet toolchain install agbcc
          uv run --no-sync python -m tools.gba_cpp.check_sandbox
