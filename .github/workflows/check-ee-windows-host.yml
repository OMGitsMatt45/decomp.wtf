name: Experimental native Windows EE host

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/check-ee-windows-host.yml"
      - "tools/ps2_cpp/elf_host/**"
      - "src/decompnet/ee_native.py"
      - "tests/test_ee_templates.py"
      - "src/decompnet/toolchains.*"
      - "src/decompnet/project.py"
      - "tests/test_ee_native_local.py"
  pull_request:
    paths:
      - ".github/workflows/check-ee-windows-host.yml"
      - "tools/ps2_cpp/elf_host/**"
      - "src/decompnet/ee_native.py"
      - "tests/test_ee_templates.py"
      - "src/decompnet/toolchains.*"
      - "src/decompnet/project.py"
      - "tests/test_ee_native_local.py"

permissions:
  contents: read

jobs:
  native-windows:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --group dev --python 3.12
      - name: Check the local native toolchain configuration
        run: uv run --no-sync python -m pytest -q tests/test_ee_native_local.py tests/test_ee_templates.py
      - uses: msys2/setup-msys2@v2
        id: msys2
        with:
          msystem: MINGW32
          path-type: inherit
          install: mingw-w64-i686-gcc mingw-w64-i686-binutils
      - name: Download the original compiler archive
        shell: pwsh
        run: |
          uv run --no-sync python -c "import os, pathlib, urllib.request; urllib.request.urlretrieve('https://github.com/decompme/compilers/releases/download/compilers/ee-gcc2.96.tar.xz', pathlib.Path(os.environ['RUNNER_TEMP']) / 'ee-gcc2.96.tar.xz')"
      - name: Build the Windows hosts (archive and helper checksums required)
        shell: pwsh
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          $bin = Join-Path $env:MSYS2_LOCATION 'mingw32/bin'
          $env:PATH = "$bin;$env:PATH"
          uv run --no-sync python tools/ps2_cpp/elf_host/build.py `
            --archive "$env:RUNNER_TEMP/ee-gcc2.96.tar.xz" `
            --output "$env:RUNNER_TEMP/EE host with spaces" `
            --cc "$bin/gcc.exe" `
            --objcopy "$bin/objcopy.exe"
          if ($LASTEXITCODE -ne 0) { throw 'Building the Windows hosts failed; see build summary' }
      - name: Package payload-free templates and reconstruct exact executables
        shell: pwsh
        run: |
          uv run --no-sync python tools/ps2_cpp/elf_host/package.py "$env:RUNNER_TEMP/EE host with spaces" "$env:RUNNER_TEMP/ee-packages"
          if ($LASTEXITCODE -ne 0) { throw 'Host packaging failed' }
          uv run --no-sync python -c "import os, pathlib, tarfile; from decompnet.ee_native import materialize; root=pathlib.Path(os.environ['RUNNER_TEMP']); dest=root/'EE host with spaces'; tarfile.open(root/'ee-packages/ee-windows-templates-v1.tar.gz').extractall(dest, filter='data'); materialize(dest)"
          if ($LASTEXITCODE -ne 0) { throw 'Host reconstruction failed' }
      - name: Require complete object parity on native Windows
        shell: pwsh
        run: |
          $python = Join-Path $env:GITHUB_WORKSPACE '.venv/Scripts/python.exe'
          $candidate = (Join-Path $env:RUNNER_TEMP 'EE host with spaces/bin/ee-gcc.exe').Replace('\', '/')
          $env:PATH = Join-Path $env:SystemRoot 'System32'
          & $python tools/ps2_cpp/elf_host/probe.py `
            --candidate-command "'$candidate'" `
            --golden tools/ps2_cpp/elf_host/reference.json `
            --execution 'Native Windows Server 2022 x64, Win32 host; System32-only PATH; no WSL/wibo/QEMU' `
            --work "$env:RUNNER_TEMP/native EE parity with spaces"
          if ($LASTEXITCODE -ne 0) { throw 'Original EE compiler parity failed on native Windows' }
      - name: Use a managed installation directory containing spaces
        shell: pwsh
        run: |
          "DECOMPNET_TOOLCHAINS=$env:RUNNER_TEMP/Managed EE toolchains with spaces" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Prepare matching and export test dependencies
        shell: pwsh
        run: |
          uv run --no-sync decompnet toolchain install binutils-mips
          if ($LASTEXITCODE -ne 0) { throw 'Installing MIPS binutils failed' }
          uv run --no-sync decompnet toolchain install m2c
          if ($LASTEXITCODE -ne 0) { throw 'Installing m2c failed' }
          uv run --no-sync python projects/zlib/prepare.py
          if ($LASTEXITCODE -ne 0) { throw 'Preparing the redistributable demo failed' }
      - name: Install the registered Windows package without a local build override
        shell: pwsh
        run: |
          Remove-Item Env:DECOMP_EE_NATIVE_ROOT -ErrorAction SilentlyContinue
          uv run --no-sync decompnet toolchain install ee-gcc-2.96
          if ($LASTEXITCODE -ne 0) { throw 'Installing the registered native EE package failed' }
          uv run --no-sync python -c "from decompnet import toolchains; tc=toolchains.get('ee-gcc-2.96'); m=toolchains.installed(tc.id); assert tc.supported and not tc.via_wsl and not tc.dependencies() and m and not m.get('local_build') and not m.get('wsl'); print(toolchains.require(tc.id))"
          if ($LASTEXITCODE -ne 0) { throw 'Managed EE installation is not native' }
      - name: Require native Windows matching and clean exported rebuilds
        shell: pwsh
        run: |
          uv run --no-sync python tools/ps2_cpp/elf_host/integration.py `
            --managed --toolchain "$env:DECOMPNET_TOOLCHAINS/ee-gcc-2.96" `
            --work "$env:RUNNER_TEMP/native EE integration with spaces"
          if ($LASTEXITCODE -ne 0) { throw 'Native Windows PS2 integration failed' }
      - name: Save reports (no compiler binaries published)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-ee-host-reports
          path: |
            ${{ runner.temp }}/native EE parity with spaces/report.json
            ${{ runner.temp }}/EE host with spaces/host-build.json
            ${{ runner.temp }}/native EE integration with spaces/summary.json
            ${{ runner.temp }}/native EE integration with spaces/results.xml
            ${{ runner.temp }}/native EE integration with spaces/output.log
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        with:
          name: ee-windows-host-package
          path: ${{ runner.temp }}/ee-packages/*.tar.gz
          compression-level: 0
  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/codex/compiler-completion'
    needs: native-windows
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: ee-windows-host-package
          path: ${{ runner.temp }}/ee-packages
      - name: Publish verified payload-free hosts and complete host source
        shell: bash
        run: |
          set -euo pipefail
          branch=ee-windows-host-assets
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null; then
            git fetch origin "$branch"
            git switch -c "$branch" "origin/$branch"
          else
            git switch -c "$branch" origin/main
          fi
          mkdir -p toolchains/ee-windows-host
          cp "$RUNNER_TEMP/ee-packages/"*.tar.gz toolchains/ee-windows-host/
          (cd toolchains/ee-windows-host && sha256sum *.tar.gz > SHA256SUMS)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add toolchains/ee-windows-host
          git diff --cached --quiet || git commit -m "Package verified native EE host templates and corresponding host source"
          git push origin "$branch"
