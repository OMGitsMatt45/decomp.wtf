name: DSi container qualification

on:
  pull_request:
    paths:
      - '.github/workflows/dsi.yml'
      - 'src/decompnet/rom/dsi.py'
      - 'tests/test_dsi.py'
      - 'tools/dsi_inspect.py'
      - 'pyproject.toml'
      - 'uv.lock'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  container:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --group dev --python 3.12
      - run: uv run --no-sync python -m pytest -q tests/test_dsi.py
