name: DS static PC repository

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/decompnet/nds_pc/**'
      - 'src/decompnet/nds_native/**'
      - 'src/decompnet/pc.py'
      - 'src/decompnet/pc_cli.py'
      - 'src/decompnet/rom/nds_modules.py'
      - 'src/decompnet/toolchains.toml'
      - 'tests/test_nds_pc.py'
      - 'tests/test_nds_native.py'
      - 'tests/test_nds_cheats.py'
      - 'tests/test_nds_native_callbacks.py'
      - 'tests/test_nds_native_guest_work.py'
      - 'tests/test_nds_native_app.py'
      - 'tests/test_nds_native_video.py'
      - 'tests/test_nds_capture_origins.py'
      - 'tests/fixtures/nds_capture_origins.cpp'
      - 'tests/fixtures/nds_video.cpp'
      - 'tests/fixtures/nds_audio.cpp'
      - 'tests/fixtures/nds_settings.cpp'
      - 'tests/fixtures/nds_geometry.cpp'
      - 'src/decompnet/app/**'
      - 'tests/fixtures/nds-static/**'
      - 'tests/fixtures/nds-hardware/**'
      - 'tests/fixtures/nds-video/**'
      - 'tests/fixtures/nds-rtc/**'
      - 'tests/fixtures/nds_static.py'
      - 'tests/fixtures/nds_native.py'
      - '.github/workflows/ds-static.yml'
      - 'pyproject.toml'
      - 'uv.lock'

permissions:
  contents: read

jobs:
  static:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      DECOMP_RUNTIME: native
      DECOMP_UPDATES: 'off'
      DECOMP_REQUIRE_DS_NATIVE: '1'
      DECOMP_REQUIRE_DS_SDL: '1'
      DECOMP_REQUIRE_DS_GPU: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --group dev --python 3.12
      - name: Install checksum-pinned DS native runtime sources
        run: uv run --no-sync python -c "from decompnet import toolchains; toolchains.install('dsr-sdk')"
      - name: Generate, build and execute original DS code and compare CPU oracles
        run: >-
          uv run --no-sync python -m pytest -q
          tests/test_nds_pc.py tests/test_nds_native.py tests/test_nds_cheats.py tests/test_nds_native_callbacks.py tests/test_nds_native_guest_work.py tests/test_nds_native_app.py tests/test_nds_native_video.py tests/test_nds_capture_origins.py tests/test_pc_output.py
          --junitxml=ds-static-results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ds-static-${{ matrix.os }}
          path: ds-static-results.xml
