name: GBA native foundation

on:
  workflow_dispatch:
  pull_request:
    paths: ['src/decompnet/gba_native/**', 'src/decompnet/pc_cli.py', 'src/decompnet/toolchains.toml', 'tests/test_gba_native.py', 'tests/fixtures/gba*', 'tests/fixtures/gba-native/**', '.github/workflows/gba-native.yml']
  push:
    branches: [codex/future-gba]

permissions:
  contents: read

jobs:
  translated-core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      DECOMP_RUNTIME: native
      DECOMP_UPDATES: 'off'
      DECOMP_REQUIRE_GBA_NATIVE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --group dev --python 3.12
      - name: Install pinned GBA source SDK
        run: uv run --no-sync python -c "from decompnet import toolchains; toolchains.ensure('anygba-sdk')"
      - name: Build and execute independent ARM/Thumb hardware probes
        run: uv run --no-sync python -m pytest -q tests/test_gba_native.py --junitxml=gba-native-results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gba-native-${{ matrix.os }}
          path: gba-native-results.xml
