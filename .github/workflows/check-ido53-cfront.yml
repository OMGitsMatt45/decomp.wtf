name: Classic IDO 5.3 native compiler

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/check-ido53-cfront.yml'
      - 'tools/ido53/**'
      - 'src/decompnet/ido_cfront.py'
      - 'src/decompnet/project.py'
      - 'tests/test_ido_cfront.py'
      - 'tests/test_ido_cfront_config.py'
      - 'tests/test_ido_cpp.py'
      - 'tests/fixtures/ido53_cfront_*.json'
  pull_request:
    paths:
      - '.github/workflows/check-ido53-cfront.yml'
      - 'tools/ido53/**'
      - 'src/decompnet/ido_cfront.py'
      - 'src/decompnet/project.py'
      - 'tests/test_ido_cfront.py'
      - 'tests/test_ido_cfront_config.py'
      - 'tests/test_ido_cpp.py'
      - 'tests/fixtures/ido53_cfront_*.json'

permissions:
  contents: read

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      DECOMP_TEST_IDO_CFRONT: '1'
      DECOMP_UPDATES: 'off'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --group dev --python 3.12
      - run: uv run --no-sync python -m pytest -q tests/test_ido_cfront_config.py
      - uses: msys2/setup-msys2@v2
        if: runner.os == 'Windows'
        with:
          update: true
          path-type: inherit
          install: gcc make git python tar
      - name: Build classic CC, cfront and repository helpers on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: bash tools/ido53/build-cfront.sh "$RUNNER_TEMP/ido53-cfront-build" "$RUNNER_TEMP/ido53-cfront-artifacts"
      - name: Build classic CC, cfront and repository helpers on Windows
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          if ! bash tools/ido53/build-cfront.sh "$RUNNER_TEMP/ido53-cfront-build" "$RUNNER_TEMP/ido53-cfront-artifacts" > "$RUNNER_TEMP/ido53-cfront-build.log" 2>&1; then
            python - "$RUNNER_TEMP/ido53-cfront-build.log" <<'PY'
          from pathlib import Path
          import sys
          text = '\n'.join(Path(sys.argv[1]).read_text(errors='replace').splitlines()[-45:])
          print('::error::' + text.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A'))
          PY
            exit 1
          fi
      - name: Install pinned original 5.3 stages and the local classic overlay
        shell: bash
        run: |
          uv run --no-sync decompnet toolchain install ido-5.3 --accept-license
          uv run --no-sync decompnet toolchain install binutils-mips
          uv run --no-sync python -m tools.ido53.install_cfront "$RUNNER_TEMP/ido53-cfront-build/package"
      - name: Require classic parity, matching and clean exported rebuilds without WSL
        shell: bash
        run: |
          uv run --no-sync python -m pytest -q tests/test_ido_cfront.py --junitxml="$RUNNER_TEMP/ido53-cfront-results.xml"
      - name: Require no skipped compiler tests and expose failures
        if: always()
        shell: bash
        run: |
          uv run --no-sync python - "$RUNNER_TEMP/ido53-cfront-results.xml" <<'PY'
          from pathlib import Path
          import sys, xml.etree.ElementTree as ET
          path = Path(sys.argv[1])
          if not path.is_file():
              raise SystemExit('No classic compiler test results were produced')
          root = ET.parse(path).getroot()
          cases = root.findall('.//testcase')
          for case in cases:
              for node in [*case.findall('failure'), *case.findall('error')]:
                  text = (node.text or node.get('message', ''))[-3500:]
                  print('::error::' + text.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A'))
          assert cases and not root.findall('.//skipped'), 'Required compiler tests were skipped'
          assert not root.findall('.//failure') and not root.findall('.//error')
          PY
      - name: Compare directly with the unmodified original IRIX cfront
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          reference="$RUNNER_TEMP/ido53-reference"
          mkdir -p "$reference"
          curl -fL https://github.com/n64decomp/qemu-irix/releases/download/v2.11-deb/qemu-irix-2.11.0-2169-g32ab296eef_amd64.deb -o "$reference/qemu.deb"
          (cd "$reference" && printf '%s\n' '8170f37cf03a08cc2d7c1c58f10d650ea0d158f711f6916da9364f6d8c85f741  qemu.deb' | sha256sum -c -)
          dpkg-deb -x "$reference/qemu.deb" "$reference/qemu"
          qemu="$reference/qemu/usr/bin/qemu-irix"
          irix="$RUNNER_TEMP/ido53-cfront-build/source/ido/5.3"
          chmod +x "$irix/usr/lib/ld" "$irix/lib/rld"
          "$qemu" -L "$irix" "$irix/usr/lib/ld" -shared -all "$irix/usr/lib/libC.a" -o "$irix/usr/lib/libC.so" -L"$irix/usr/lib" -lc
          uv run --no-sync python -m tools.ido53.verify_cfront --irix-root "$irix" --qemu "$qemu"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ido53-cfront-reports-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/ido53-cfront-results.xml
            ${{ runner.temp }}/ido53-cfront-build.log
            ${{ runner.temp }}/ido53-cfront-build/package/cfront-build.json
          if-no-files-found: warn
