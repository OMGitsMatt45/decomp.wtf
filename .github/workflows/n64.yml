name: Nintendo 64 native qualification

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/n64.yml'
      - 'src/**'
      - 'native/n64/**'
      - 'tests/**'
      - 'tools/ido53/**'
      - 'tools/*operational*.py'
      - 'projects/demo-n64/**'
      - 'projects/demo-rom/**'
      - 'projects/zlib-n64/**'
      - 'pyproject.toml'
      - 'uv.lock'

permissions:
  contents: read

jobs:
  n64:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      DECOMP_RUNTIME: native
      DECOMP_UPDATES: 'off'
      DECOMP_TEST_N64_CPP: '1'
      DECOMP_TEST_IDO_CPP: '1'
      DECOMP_TEST_IDO_CFRONT: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --group dev --python 3.12
      - name: Linux native compiler runtime and fixture linker
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libc6-i386 lld llvm
      - name: Windows fixture linker
        if: runner.os == 'Windows'
        shell: pwsh
        run: Add-Content $env:GITHUB_PATH 'C:\Program Files\LLVM\bin'
      - name: Isolate native toolchains in a directory with spaces
        shell: bash
        run: echo "DECOMPNET_TOOLCHAINS=$RUNNER_TEMP/Nintendo 64 tools with spaces" >> "$GITHUB_ENV"
      - name: Install pinned compilers and prepare original fixtures
        run: uv run --no-sync python -m tools.operational --n64-only
      - name: Qualify KMC, IDO 5.3 EDG, classic cfront and IDO 7.1
        run: >-
          uv run --no-sync python tools/run_operational.py
          tests/test_n64_cpp.py tests/test_ido_cpp.py tests/test_ido_cfront.py tests/test_ido_dependencies.py
          tests/test_n64_native.py tests/test_n64code.py tests/test_native_threads.py tests/test_overlays.py
          tests/test_n64_layouts.py tests/test_n64_shiftable.py tests/test_n64_workflows.py
          tests/test_n64_runtime.py tests/test_n64_crc.py tests/test_cpp_output.py
          tests/test_n64_owned_data.py
          tests/test_n64_linker.py
          tests/test_n64_expansion.py tests/test_collab.py
          tests/test_rom.py tests/test_app_engine.py tests/test_export.py -k "not psx and not ps2"
      - name: Require every N64 suite without skips
        run: uv run --no-sync python tools/check_operational_results.py --n64-only operational-results.xml
      - name: Report failures
        if: always()
        run: uv run --no-sync python tools/operational_report.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: n64-qualification-${{ matrix.os }}
          path: |
            operational-results.xml
            operational-output.log
