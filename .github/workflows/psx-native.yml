name: PS1 native PC repository

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/decompnet/psx_native/**'
      - 'src/decompnet/pc*.py'
      - 'src/decompnet/app/**'
      - 'src/decompnet/toolchains.toml'
      - 'tests/test_psx_native*.py'
      - 'tests/test_pc_output.py'
      - 'tests/fixtures/psx_hardware.py'
      - '.github/workflows/psx-native.yml'
      - 'pyproject.toml'
      - 'uv.lock'

permissions:
  contents: read

jobs:
  standalone:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      DECOMP_RUNTIME: native
      DECOMP_UPDATES: 'off'
      DECOMP_REQUIRE_PSX_NATIVE: '1'
      DECOMP_REQUIRE_PSX_GPU: ${{ matrix.os == 'ubuntu-24.04' && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --group dev --python 3.12
      - name: Install Linux OpenGL and SDL development libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxext-dev libxcursor-dev libxi-dev libxfixes-dev libxrandr-dev libxss-dev libxtst-dev libasound2-dev libgl-dev libegl-dev libglx-mesa0 libegl-mesa0 libgl1-mesa-dri
      - name: Fetch checksum-pinned optional noncommercial runtime sources
        run: uv run --no-sync python -c "from decompnet import toolchains; toolchains.install('psxrecomp-sdk')"
      - name: Export, build and execute the original ordered two-disc game
        run: >-
          uv run --no-sync python -m pytest -q
          tests/test_psx_native.py tests/test_psx_native_discovery.py tests/test_psx_native_copies.py tests/test_psx_native_kernel.py tests/test_psx_native_compatibility.py tests/test_psx_native_app.py tests/test_pc_output.py
          --basetemp=ps1-standalone-results --junitxml=ps1-standalone-results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ps1-standalone-${{ matrix.os }}
          path: |
            ps1-standalone-results.xml
            ps1-standalone-results/**/*.json
            ps1-standalone-results/**/*.log
