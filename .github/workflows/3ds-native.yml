name: 3DS native source foundation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/decompnet/ctr_native/**'
      - 'src/decompnet/pc*.py'
      - 'src/decompnet/platforms.py'
      - 'src/decompnet/rom/detect.py'
      - 'src/decompnet/nds_native/hash.hpp'
      - 'tools/ctr_fixture.py'
      - 'tests/test_ctr_native.py'
      - '.github/workflows/3ds-native.yml'

permissions:
  contents: read

jobs:
  native-source:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      DECOMP_TEST_3DS_NATIVE: '1'
      DECOMP_UPDATES: 'off'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.95.0'
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - run: uv sync --locked --group dev --python 3.12
      - name: Validate original images and build/execute ARM, Thumb and VFP native source
        run: uv run --no-sync python -m pytest -q tests/test_ctr_native.py --junitxml=ctr-source-results.xml
      - name: Require every native source case without skips
        run: >-
          uv run --no-sync python -c "import xml.etree.ElementTree as E;
          root=E.parse('ctr-source-results.xml').getroot();
          assert sum(int(s.get('skipped','0')) for s in root.iter('testsuite'))==0"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ctr-source-${{ matrix.os }}
          path: ctr-source-results.xml
