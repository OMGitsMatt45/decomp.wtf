name: Check Windows IDO artifact
on:
  workflow_dispatch:
  push:
    branches: [ido-game-cpp]
    paths: [.github/workflows/check-ido-artifact.yml, tools/windows/check_ido_artifact.py]
permissions:
  actions: read
  contents: read
jobs:
  check:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: standalone-ido-windows
          run-id: 39222513441
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/ido-artifacts
      - name: Check native path handling and compiler exit codes
        shell: powershell
        run: |
          $tools = Join-Path $env:RUNNER_TEMP "IDO runtime check"
          New-Item -ItemType Directory -Path $tools | Out-Null
          tar -xzf (Join-Path $env:RUNNER_TEMP "ido-artifacts\ido-7.1-windows-v1.tar.gz") -C $tools
          if ($LASTEXITCODE -ne 0) { throw "Extracting IDO failed" }
          python tools/windows/check_ido_artifact.py $tools
