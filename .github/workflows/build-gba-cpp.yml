name: Build native GBA C++

on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/gba_cpp/**'
      - '.github/workflows/build-gba-cpp.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        platform: [linux-x86_64, windows-x86_64]
    steps:
      - uses: actions/checkout@v4
      - name: Install cross compiler
        if: matrix.platform == 'windows-x86_64'
        run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-i686
      - name: Build the separate C++ frontend and source bundle
        run: bash tools/gba_cpp/build.sh "$RUNNER_TEMP/build" "$RUNNER_TEMP/artifacts" ${{ matrix.platform }}
      - uses: actions/upload-artifact@v4
        with:
          name: agbcc-cpp-${{ matrix.platform }}
          path: ${{ runner.temp }}/artifacts/*
          compression-level: 0
  verify:
    needs: build
    strategy:
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux-x86_64
          - os: windows-2022
            platform: windows-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: agbcc-cpp-${{ matrix.platform }}
          path: artifacts
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --group dev --python 3.12
      - name: Install unchanged agbcc and Arm GNU preprocessing/assembler tools
        run: uv run --no-sync decompnet toolchain install agbcc
      - name: Verify genuine C++ and original backend parity without WSL
        shell: bash
        run: |
          mkdir overlay
          tar -xzf artifacts/agbcc-cpp-${{ matrix.platform }}.tar.gz -C overlay
          uv run --no-sync python -m tools.gba_cpp.smoke overlay
          uv run --no-sync python -c "import pathlib,shutil; from decompnet import toolchains; tc=toolchains.require('agbcc'); [shutil.copy2(p,tc/p.name) for p in pathlib.Path('overlay').glob('*cpp*') if p.is_file()]"
          DECOMP_TEST_GBA_CPP=1 uv run --no-sync python -m pytest -q tests/test_gba_cpp.py -k each_thumb
  publish:
    needs: verify
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/codex/compiler-completion'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: agbcc-cpp-*
          path: artifacts
      - name: Publish verified frontends and complete corresponding source
        run: |
          set -euo pipefail
          branch=gba-cpp-assets
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null; then
            git fetch origin "$branch"
            git switch -c "$branch" "origin/$branch"
          else
            git switch -c "$branch" origin/main
          fi
          mkdir -p toolchains/gba-cpp
          cp artifacts/agbcc-cpp-*/*.tar.gz toolchains/gba-cpp/
          (cd toolchains/gba-cpp && sha256sum *.tar.gz > SHA256SUMS)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add toolchains/gba-cpp
          git commit -m "Package verified native agbcc C++ frontends and complete source"
          git push origin "$branch"
