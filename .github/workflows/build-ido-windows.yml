name: Build standalone Windows IDO

on:
  workflow_dispatch:
  push:
    branches: [ido-game-cpp]
    paths: [tools/windows/build-ido71.sh, .github/workflows/build-ido-windows.yml]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: msys2/setup-msys2@v2
        with:
          update: true
          install: gcc make git python curl tar
      - name: Build the original IDO pipeline with its Windows memory fix
        shell: msys2 {0}
        run: bash tools/windows/build-ido71.sh "$RUNNER_TEMP/ido-build" "$RUNNER_TEMP/ido-artifacts"
      - name: Compile real C++ without MSYS on PATH
        shell: powershell
        run: |
          $tools = Join-Path $env:RUNNER_TEMP "ido-build\package"
          $source = Join-Path $env:RUNNER_TEMP "IDO build check.cpp"
          $object = Join-Path $env:RUNNER_TEMP "IDO build check.o"
          $code = "#ifndef __cplusplus`n#error C++ frontend required`n#endif`ntemplate<class T> class Box { public: T value; };`nextern `"C`" int probe(int x) { Box<int> b; int &r = b.value; r = x + 1; return b.value; }`n"
          [IO.File]::WriteAllText($source, $code, (New-Object Text.UTF8Encoding($false)))
          $env:PATH = Join-Path $env:SystemRoot "System32"
          # The application sets this per invocation too; a regular Windows
          # installation has no Unix /tmp directory.
          $env:TMPDIR = $env:RUNNER_TEMP.Replace('\', '/')
          & (Join-Path $tools "NCC.exe") -c -O2 -mips2 -G 0 -non_shared $source -o $object
          if ($LASTEXITCODE -ne 0 -or !(Test-Path $object)) { throw "The standalone IDO C++ compiler failed" }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: standalone-ido-windows
          path: ${{ runner.temp }}/ido-artifacts/*
          compression-level: 0
      - name: Publish pinned compiler and corresponding source on the assets branch
        shell: bash
        run: |
          set -euo pipefail
          branch=ido-cpp-windows-assets
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null; then
            git fetch origin "$branch"
            git switch -c "$branch" "origin/$branch"
          else
            git switch -c "$branch" origin/main
          fi
          mkdir -p toolchains/windows/ido
          cp "$RUNNER_TEMP/ido-artifacts/"* toolchains/windows/ido/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add toolchains/windows/ido
          git commit -m "Package IDO 7.1 with the Windows memory fix and its runtime"
          git push origin "$branch"
